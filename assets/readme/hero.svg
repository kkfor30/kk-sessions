    <text x="28" y="38" font-size="16" fill="#8E897F">侧栏 · 示意</text>

    <g transform="translate(28 56)">
      <circle cx="7" cy="14" r="7" fill="#9B7BE0"/>
      <text x="24" y="21" font-size="20" font-weight="600" fill="#F5F2EB">内容制作</text>
      <text x="24" y="60" font-size="20" fill="#D9D4C9">✍️ 工具教程<tspan fill="#E0672F">｜</tspan>脚本大纲</text>
      <text x="24" y="98" font-size="20" fill="#D9D4C9">🎬 新品测评<tspan fill="#E0672F">｜</tspan>口播精剪</text>
