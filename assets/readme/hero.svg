      <rect x="12" y="34" width="448" height="40" rx="10" fill="#34322C"/>
      <rect x="12" y="40" width="4" height="28" rx="2" fill="#E0672F"/>
      <text x="24" y="61" font-size="20" fill="#F5F2EB">🛠️ 截图整理<tspan fill="#E0672F">｜</tspan>工具方案 ⏳</text>
      <text x="444" y="61" font-size="16" fill="#8E897F" text-anchor="end">刚刚</text>
