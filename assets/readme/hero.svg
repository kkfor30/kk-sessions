<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">kk-sessions</title>
  <desc id="desc">新会话自己起名、归分区，产物写进对的目录。右侧是整理后的侧栏示意：会话按分区排好，标题统一为「类型 emoji 主题｜这次做什么」，在等你处理的会话末尾带沙漏。</desc>

  <rect width="1200" height="420" rx="24" fill="#F5F2EB"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#857F74">CLAUDE CODE · CODEX 桌面端</text>
    <text x="60" y="176" font-size="76" font-weight="700" fill="#1C1B19" letter-spacing="-1">kk-sessions</text>
    <text x="64" y="236" font-size="30" fill="#1C1B19">新会话自己起名、归分区，</text>
    <text x="64" y="280" font-size="30" fill="#1C1B19">产物写进对的目录。</text>

    <g id="formula" transform="translate(64 318)">
      <rect width="452" height="52" rx="12" fill="#ECE7DC"/>
      <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#1C1B19">&lt;emoji&gt; 主题<tspan fill="#E0672F" font-weight="700">｜</tspan>这次做什么<tspan fill="#857F74"> ⏳</tspan></text>
    </g>
  </g>

  <g id="sidebar-proof" transform="translate(648 40)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
