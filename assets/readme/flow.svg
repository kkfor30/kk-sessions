<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">kk-sessions 怎么归位</title>
  <desc id="desc">三步：你照常提需求；Agent 对照工作区地图判断分区、目录和类型；最后标题、侧栏分区、产物目录三件事一起落位。</desc>

  <rect width="1200" height="400" rx="24" fill="#F5F2EB"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- 1 -->
    <g transform="translate(48 48)">
      <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E0672F">01</text>
      <text x="44" y="22" font-size="24" font-weight="700" fill="#1C1B19">你照常提需求</text>
      <rect x="0" y="52" width="330" height="128" rx="16" fill="#24231F"/>
      <text x="24" y="96" font-size="20" fill="#8E897F">新会话</text>
      <text x="24" y="134" font-size="21" fill="#F5F2EB">帮我写一份 AI 工具</text>
      <text x="24" y="164" font-size="21" fill="#F5F2EB">教程大纲，存成 Markdown</text>
      <text x="0" y="234" font-size="20" fill="#857F74">不用多说一句「归到哪」</text>
    </g>

    <path d="M398 164 H432" stroke="#C9C2B4" stroke-width="3" stroke-linecap="round"/>
    <path d="M426 156 L436 164 L426 172" fill="none" stroke="#C9C2B4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2 -->
    <g transform="translate(456 48)">
      <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E0672F">02</text>
      <text x="44" y="22" font-size="24" font-weight="700" fill="#1C1B19">对照工作区地图</text>
      <rect x="0" y="52" width="300" height="128" rx="16" fill="#FFFFFF" stroke="#E2DCCF" stroke-width="2"/>
      <text x="20" y="88" font-size="18" fill="#857F74">分区 · 目录 · 线索</text>
      <rect x="12" y="102" width="276" height="34" rx="8" fill="#FBE6DA"/>
      <text x="20" y="126" font-size="20" fill="#1C1B19">内容制作 · 内容\&lt;主题&gt;\</text>
      <text x="20" y="164" font-size="20" fill="#857F74">项目 · 项目\&lt;名称&gt;\</text>
      <text x="0" y="234" font-size="20" fill="#857F74">一份地图，两个 Agent 共用</text>
    </g>

    <path d="M776 164 H810" stroke="#C9C2B4" stroke-width="3" stroke-linecap="round"/>
    <path d="M804 156 L814 164 L804 172" fill="none" stroke="#C9C2B4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3 -->
    <g transform="translate(834 48)">
      <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E0672F">03</text>
      <text x="44" y="22" font-size="24" font-weight="700" fill="#1C1B19">三件事一起落位</text>
      <g transform="translate(0 52)">
        <text x="0" y="24" font-size="18" fill="#857F74">标题</text>
        <text x="56" y="24" font-size="20" fill="#1C1B19">✍️ 工具教程<tspan fill="#E0672F">｜</tspan>脚本大纲</text>
        <text x="0" y="70" font-size="18" fill="#857F74">分区</text>
        <circle cx="64" cy="63" r="7" fill="#9B7BE0"/>
        <text x="80" y="70" font-size="20" fill="#1C1B19">内容制作</text>
        <text x="0" y="116" font-size="18" fill="#857F74">目录</text>
        <text x="56" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#1C1B19">内容\工具教程\</text>
      </g>
      <text x="0" y="234" font-size="20" fill="#857F74">会话和文件夹一一对应</text>
    </g>

    <line x1="48" y1="318" x2="1152" y2="318" stroke="#E2DCCF" stroke-width="2"/>
    <text x="48" y="358" font-size="20" fill="#857F74">Claude Code：第一轮结束前由会话自己归位　·　Codex：每轮结束后由后台小模型归位</text>
  </g>
</svg>
