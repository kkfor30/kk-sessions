<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">kk-sessions 怎么工作</title>
  <desc id="desc">一个例子走完三步。第一步，你照常提需求：帮我写一份 AI 工具教程大纲，存成 Markdown。第二步，对照工作区地图，命中「内容制作」这一行，目录是 内容\主题\。第三步，三件事一起落位：侧栏里标题变成「✍️ 工具教程｜脚本大纲」并放进内容制作分区，文件写进 内容\工具教程\大纲.md。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#C9C2B8"/>
    </marker>
    <g id="folder">
      <path d="M0 3.5a2.5 2.5 0 0 1 2.5-2.5h4.6l2.2 2.4h8.2a2.5 2.5 0 0 1 2.5 2.5v9.6a2.5 2.5 0 0 1-2.5 2.5H2.5A2.5 2.5 0 0 1 0 15.5z" fill="#FFE3D6" stroke="#FF6A3D" stroke-width="1.6"/>
    </g>
  </defs>

  <rect width="1200" height="540" rx="28" fill="#FFFCF8"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- 1 你照常提需求 -->
    <g transform="translate(48 48)">
      <circle cx="18" cy="18" r="18" fill="#FF6A3D"/>
      <text x="18" y="25" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">1</text>
      <text x="48" y="27" font-size="26" font-weight="700" fill="#111827">你照常提需求</text>
      <g transform="translate(0 64)">
        <rect width="336" height="300" rx="20" fill="#FFFFFF" stroke="#EDE7DE" stroke-width="1.5"/>
        <text x="24" y="42" font-size="18" fill="#6B7280">新会话</text>
        <rect x="24" y="64" width="288" height="112" rx="16" fill="#111827"/>
        <text x="44" y="108" font-size="21" fill="#FFFFFF">帮我写一份 AI 工具教程</text>
        <text x="44" y="144" font-size="21" fill="#FFFFFF">大纲，存成 Markdown</text>
        <g transform="translate(24 214)">
          <rect width="288" height="58" rx="14" fill="#F6F3EE"/>
          <text x="20" y="36" font-size="19" fill="#374151">不用说「归到哪、存哪里」</text>
        </g>
      </g>
    </g>

    <path d="M398 262h28" stroke="#C9C2B8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- 2 对照工作区地图 -->
    <g transform="translate(432 48)">
      <circle cx="18" cy="18" r="18" fill="#FF6A3D"/>
      <text x="18" y="25" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">2</text>
      <text x="48" y="27" font-size="26" font-weight="700" fill="#111827">对照工作区地图</text>
      <g transform="translate(0 64)">
        <rect width="336" height="300" rx="20" fill="#FFFFFF" stroke="#EDE7DE" stroke-width="1.5"/>
        <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6B7280">workspace-map.md</text>
        <g transform="translate(16 66)">
          <rect width="304" height="62" rx="14" fill="#F3EEFF" stroke="#8B5CF6" stroke-width="2"/>
          <circle cx="24" cy="31" r="8" fill="#8B5CF6"/>
          <text x="42" y="38" font-size="20" font-weight="700" fill="#111827">内容制作</text>
          <text x="140" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5B21B6">内容\&lt;主题&gt;\</text>
        </g>
        <g transform="translate(16 140)" opacity="0.75">
          <circle cx="24" cy="31" r="8" fill="#3B82F6"/>
          <text x="42" y="38" font-size="20" fill="#374151">工具开发</text>
          <text x="140" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6B7280">项目\&lt;名称&gt;\</text>
        </g>
        <g transform="translate(16 200)" opacity="0.75">
          <circle cx="24" cy="31" r="8" fill="#F5A524"/>
          <text x="42" y="38" font-size="20" fill="#374151">杂项</text>
          <text x="140" y="38" font-size="18" fill="#6B7280">一次性问答</text>
        </g>
      </g>
    </g>

    <path d="M782 262h28" stroke="#C9C2B8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- 3 三件事一起落位 -->
    <g transform="translate(816 48)">
      <circle cx="18" cy="18" r="18" fill="#FF6A3D"/>
      <text x="18" y="25" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">3</text>
      <text x="48" y="27" font-size="26" font-weight="700" fill="#111827">三件事一起落位</text>
      <g transform="translate(0 64)">
        <rect width="336" height="150" rx="20" fill="#141821"/>
        <text x="24" y="38" font-size="17" fill="#9CA3AF">侧栏</text>
        <circle cx="31" cy="68" r="7" fill="#8B5CF6"/>
        <text x="48" y="75" font-size="20" font-weight="700" fill="#FFFFFF">内容制作</text>
        <rect x="16" y="94" width="304" height="40" rx="10" fill="#262C3A"/>
        <text x="32" y="121" font-size="20" fill="#F3F4F6">✍️ 工具教程<tspan fill="#FF8A5C" font-weight="700">｜</tspan>脚本大纲</text>
        <g transform="translate(0 166)">
          <rect width="336" height="134" rx="20" fill="#FFFFFF" stroke="#EDE7DE" stroke-width="1.5"/>
          <text x="24" y="38" font-size="17" fill="#6B7280">磁盘</text>
          <g transform="translate(24 54)">
            <use href="#folder"/>
            <text x="30" y="16" font-size="20" fill="#111827">内容\工具教程\</text>
          </g>
          <g transform="translate(54 90)">
            <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#111827">大纲.md</text>
            <rect x="100" y="0" width="52" height="26" rx="13" fill="#DCFCE7"/>
            <text x="126" y="19" text-anchor="middle" font-size="16" font-weight="700" fill="#15803D">新建</text>
          </g>
        </g>
      </g>
    </g>

    <line x1="48" y1="458" x2="1152" y2="458" stroke="#EDE7DE" stroke-width="1.5"/>
    <text x="48" y="500" font-size="19" fill="#374151"><tspan font-weight="700" fill="#111827">Claude Code</tspan>　第一轮结束前，会话自己归位</text>
    <circle cx="600" cy="494" r="3" fill="#C9C2B8"/>
    <text x="640" y="500" font-size="19" fill="#374151"><tspan font-weight="700" fill="#111827">Codex</tspan>　每轮结束后，后台小模型归位</text>
  </g>
</svg>
